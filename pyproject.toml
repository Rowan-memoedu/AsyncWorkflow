[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-async-workflow"
version = "0.1.0"
description = "Local voice ingestion and semantic routing on Prefect"
requires-python = ">=3.12"
# Prefect 3.8.7's hybrid state fields do not support SQLAlchemy 2.1 bulk DML.
dependencies = ["prefect==3.8.7", "SQLAlchemy[asyncio]==2.0.54", "watchfiles==1.3.0", "filelock==4.0.9", "pydantic==2.13.5", "openai==3.23.0", "openai-codex==0.159.0", "httpx==0.28.1", "fastapi==0.142.2", "uvicorn==0.54.0", "websockets==16.1.1", "markdown-it-py==4.2.0", "alibabacloud-oss-v2==1.4.0", "oss2==2.19.1", "jsonschema", "psutil>=7,<8", "pywin32; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
async-workflow = "async_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
async_workflow = ["web/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
